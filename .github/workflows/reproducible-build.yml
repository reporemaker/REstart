name: Reproducible build

# A published release is rebuilt from its tag on a clean Linux machine, unsigned, and compared
# with the signed APK attached to the release, the way F-Droid checks it: the APK must come from
# this source byte for byte, but for the signature. The signing key never comes here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, e.g. v1.3.1
        required: true
      metadata_from:
        description: Take gradle/verification-metadata.xml from this commit (only when the tag's checksums miss what a clean machine needs; the file is not in the APK); empty = the tag's own
        required: false

# Read-only: the workflow builds and compares, it writes nothing back
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The tag itself is built: AGP writes the commit id into the APK (version-control-info)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the verification metadata from a later commit
        if: inputs.metadata_from != ''
        env:
          FROM: ${{ inputs.metadata_from }}
        run: git checkout "$FROM" -- gradle/verification-metadata.xml

      # Another JDK than the one on the release machine on purpose: the result must not depend on it
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the release unsigned
        run: ./gradlew assembleProdRelease --no-daemon --no-build-cache

      - name: Download the signed APK of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir signed

      # apksigcopier copies the release's signature onto the unsigned build and checks that it
      # still verifies; it comes from Ubuntu's signed archive, not from PyPI
      - name: Compare with the signed APK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apksigcopier
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1):$PATH"
          apksigcopier compare signed/*.apk \
            --unsigned app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk

      - name: Show where they differ
        if: failure()
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q diffoscope-minimal
          diffoscope --html diffoscope.html signed/*.apk \
            app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reproducible-build-difference
          path: |
            diffoscope.html
            signed/*.apk
            app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          if-no-files-found: ignore
